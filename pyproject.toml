[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-drift"
version = "0.1.0"
description = "Rollout harness for the goal-drift project (COMPSCI 690S)"
requires-python = ">=3.10"
dependencies = [
    "mini-swe-agent==2.4.6",   # tested version
    "datasets",
    "huggingface_hub",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
vllm = ["vllm==0.33.0"]        # the GPU machine that serves the model
udocker = ["udocker==1.3.17"]  # Colab, or any machine without apptainer

[project.scripts]
goal-drift = "sandboxing.run:main"

[tool.setuptools]
# sandboxing = Track 1 (this harness). data_eval = Track 2 (David), installed so we can import his validator.
packages = ["sandboxing", "data_eval"]
